name: Node.js CI/CD

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup environment file
        run: echo "${{ secrets.PROD_ENV_FILE }}" | base64 --decode > .env

      - name: Restart backend using PM2
        run: |
          pm2 stop BackendAPI || true
          pm2 delete BackendAPI || true
          pm2 start index.js --name=BackendAPI
          pm2 save
